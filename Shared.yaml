relationship:
  id: owns
  name: Owns
  description: Indicates ownership

  source:
    entity: organization

  target:
    entity: product

  cardinality:
    source: one
    target: many

  properties:
    ownership_start_date:
      type: date

    ownership_end_date:
      type: date

  inverse:
    name: owned-by


relationship:
  id: belongs-to
  name: Belongs To

  source:
    entity: person

  target:
    entity: organization

  cardinality:
    source: many
    target: one

  inverse:
    name: has-member


relationship:
  id: located-at
  name: Located At

  source:
    entity: organization

  target:
    entity: location

  cardinality:
    source: many
    target: one

  inverse:
    name: location-of



relationship:
  id: related-to
  name: Related To

  source:
    entity: "*"

  target:
    entity: "*"

  cardinality:
    source: many
    target: many

  properties:
    relationship_type:
      type: string

    confidence:
      type: decimal
      minimum: 0
      maximum: 1


