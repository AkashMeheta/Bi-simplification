ontology:
  id: healthcare-insurance
  name: Healthcare Insurance Ontology
  namespace: healthcare.insurance
  version: "1.0.0"

  description: >
    Ontology representing healthcare insurance members,
    policies, claims, providers and coverage.

  imports:
    - core
    - common-relationships

  entities:
    - member
    - policy
    - claim
    - provider
    - coverage

  relationships:
    - member-policy
    - policy-claim
    - provider-claim

  rules:
    - claim-policy-validation
    - coverage-validation

  mappings:
    - member-source-mapping
    - policy-source-mapping
    - claim-source-mapping

  governance:
    owner: healthcare-team
    steward: healthcare-data-steward
    classification: confidential

  lifecycle:
    status: active
    created_at: "2026-01-01"
    updated_at: "2026-09-01"



metadata:
  ontology_id: healthcare-insurance

  ownership:
    business_owner: healthcare-team
    technical_owner: ontology-team
    data_steward: healthcare-data-steward

  lifecycle:
    status: active
    version: "1.0.0"

  governance:
    classification: confidential
    pii: true
    phi: true

  standards:
    modeling_language: OWL
    serialization: YAML
    graph_model: property-graph

  documentation:
    description: Healthcare insurance domain model




rule:
  id: claim-policy-validation
  name: Claim Policy Validation

  description: >
    A claim must be associated with an active policy
    during the claim service date.

  type: validation

  condition:
    all:
      - claim.policy exists
      - claim.claim_date >= policy.effective_date
      - claim.claim_date <= policy.expiration_date

  severity: error

  action:
    invalid_record: reject


rule:
  id: coverage-validation
  name: Coverage Validation

  type: validation

  condition:
    all:
      - coverage.effective_date <= coverage.expiration_date
      - coverage.coverage_limit >= 0
      - coverage.deductible >= 0

  severity: warning




