relationship:
  id: member-policy
  name: Member Has Policy

  source:
    entity: member

  target:
    entity: policy

  cardinality:
    source: many
    target: many

  properties:
    enrollment_date:
      type: date

    termination_date:
      type: date

    relationship_type:
      type: string
      allowed_values:
        - primary
        - dependent

  inverse:
    name: policy-has-member



relationship:
  id: policy-claim
  name: Policy Has Claim

  source:
    entity: policy

  target:
    entity: claim

  cardinality:
    source: one
    target: many

  properties:
    submission_date:
      type: date

    processing_date:
      type: date

  inverse:
    name: claim-belongs-to-policy



relationship:
  id: provider-claim
  name: Provider Submitted Claim

  source:
    entity: provider

  target:
    entity: claim

  cardinality:
    source: one
    target: many

  properties:
    service_date:
      type: date

    billed_amount:
      type: decimal

  inverse:
    name: claim-submitted-by-provider
